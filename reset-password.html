
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تعيين كلمة مرور جديدة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f7f4;
      color: #183c30;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    main {
      background: white;
      padding: 26px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    input, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #cedbd4; }
    button {
      border: 0;
      background: #16734f;
      color: white;
    }
    #message { line-height: 1.8; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h2>تعيين كلمة مرور جديدة</h2>
  <p>أدخل كلمة مرور جديدة لحساب المدير.</p>

  <form id="resetForm">
    <input id="password" type="password"
      placeholder="كلمة المرور الجديدة"
      minlength="8" autocomplete="new-password" required>
    <input id="confirm" type="password"
      placeholder="تأكيد كلمة المرور"
      minlength="8" autocomplete="new-password" required>
    <button id="save" type="submit">حفظ كلمة المرور</button>
  </form>

  <p id="message" role="status"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = window.supabase.createClient(
      'https://kibcxflwjjqcnvyakoue.supabase.co',
      'sb_publishable_jLeDAbiGy7MTEUUD9pa_DA_rnZkArUb'
    );

    const message = document.getElementById('message');
    const form = document.getElementById('resetForm');

    db.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        message.textContent =
          'رابط الاستعادة صالح. أدخل كلمة المرور الجديدة.';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const save = document.getElementById('save');

      if (password !== confirm) {
        message.textContent = 'كلمتا المرور غير متطابقتين.';
        return;
      }

      save.disabled = true;
      message.textContent = 'جارٍ تحديث كلمة المرور...';

      try {
        const { data, error } = await db.auth.updateUser({ password });

        if (error) throw error;
        if (!data.user) {
          throw new Error('انتهت صلاحية رابط الاستعادة. اطلب رابطًا جديدًا.');
        }

        message.textContent =
          'تم تحديث كلمة المرور. يمكنك العودة إلى صفحة الإدارة وتسجيل الدخول.';
      } catch (error) {
        message.textContent =
          'تعذر التحديث: ' + error.message +
          '. إذا انتهت صلاحية الرابط، اطلب رابط استعادة جديدًا.';
      } finally {
        save.disabled = false;
      }
    });
  </script>
</main>
</body>
</html>
