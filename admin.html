
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة الحضور - المركز الصحي</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f7f4;
      color: #183c30;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 8px 28px #173d3012;
    }
    h1 { font-size: 24px; margin-top: 0; }
    p { line-height: 1.8; color: #64756d; }
    label { display: block; margin: 16px 0 7px; }
    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #cedbd4;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #16734f;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 18px;
    }
    button:disabled { opacity: .6; }
    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>إدارة حضور الموظفين</h1>
    <p>المركز الصحي — تسجيل دخول المدير</p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email"
        autocomplete="username" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">
        تسجيل الدخول
      </button>
    </form>

    <section id="dashboard" class="hidden">
      <h2>تم التحقق من حساب المدير</h2>
      <p id="adminEmail"></p>
      <p>تم التحقق من صلاحية الحساب. سيجري ربط
      سجلات الحضور في الخطوة التالية.</p>
      <button id="logoutButton" type="button">
        تسجيل الخروج
      </button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      'https://kibcxflwjjqcnvyakoue.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_jLeDAbiGy7MTEUUD9pa_DA_rnZkArUb';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');
    const message = document.getElementById('message');
    const dashboard = document.getElementById('dashboard');
    const emailLabel = document.getElementById('adminEmail');

    function showMessage(text) {
      message.textContent = text;
    }

    function showLogin() {
      form.classList.remove('hidden');
      dashboard.classList.add('hidden');
    }

    async function verifyAdmin(user) {
      showMessage('جارٍ التحقق من صلاحيات المدير...');

      const { data, error } = await db
        .from('admins')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (error) {
        showLogin();
        showMessage(
          'تعذّر التحقق من الصلاحيات. تأكد من سياسات RLS وصلاحيات الجدول.'
        );
        return false;
      }

      if (!data) {
        await db.auth.signOut();
        showLogin();
        showMessage('هذا الحساب غير مسجل كمدير.');
        return false;
      }

      form.classList.add('hidden');
      dashboard.classList.remove('hidden');
      emailLabel.textContent = user.email || '';
      showMessage('');
      return true;
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      button.disabled = true;
      showMessage('جارٍ تسجيل الدخول...');

      try {
        const email =
          document.getElementById('email').value.trim();
        const password =
          document.getElementById('password').value;

        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMessage(
            'تعذّر تسجيل الدخول. تحقق من البريد وكلمة المرور وتأكيد الحساب.'
          );
          return;
        }

        await verifyAdmin(data.user);
      } catch (error) {
        showMessage('تعذر الاتصال بالخدمة. تحقق من الإنترنت وحاول مجددًا.');
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('logoutButton')
      .addEventListener('click', async function() {
        const { error } = await db.auth.signOut();
        showLogin();
        showMessage(error
          ? 'تعذر إكمال تسجيل الخروج.'
          : 'تم تسجيل الخروج.');
      });

    async function restoreSession() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        showMessage('تعذر التحقق من جلسة الدخول.');
        return;
      }

      if (data.session) {
        await verifyAdmin(data.session.user);
      }
    }

    restoreSession();
  </script>
</body>
</html>
